name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev --frozen

      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts

      - name: Test
        # The suite runs on in-memory SQLite, so no service container is needed.
        run: uv run pytest -q
        env:
          JWT_SECRET: ci-secret-not-used-anywhere-real

      - name: Migrations apply to a clean database
        # Guards against a model change that never got a migration.
        run: |
          uv run alembic upgrade head
          uv run alembic check
        env:
          DATABASE_URL: sqlite:///ci-check.db

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc -b --noEmit
      - run: npx eslint .
      - run: npm run build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
