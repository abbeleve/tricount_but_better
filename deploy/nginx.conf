# /etc/nginx/sites-available/tricount
#
# Static frontend + /api reverse proxy. Run certbot after the first install to
# add TLS; it rewrites this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name tricount-194-87-111-40.sslip.io;

    root /opt/tricount/web;
    index index.html;

    # JSON base64 adds about a third to the raw image size (12 MB x 8).
    client_max_body_size 160M;

    # Security headers. No CSP frame-ancestors bypass, no MIME sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;

        # Receipt parsing completes in this request and can take a few minutes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Hashed assets are immutable; the shell must never be cached or a deploy
    # leaves browsers on the old JS bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
