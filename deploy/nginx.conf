# /etc/nginx/sites-available/tricount
#
# Static frontend + /api reverse proxy. Run certbot after the first install to
# add TLS; it rewrites this file in place.

server {
    listen 80;
    listen [::]:80;
    server_name split.example.com;   # <-- change me

    root /opt/tricount/web;
    index index.html;

    # Receipt photos. Must be >= MAX_UPLOAD_MB * MAX_RECEIPT_IMAGES, with slack
    # for multipart overhead, or nginx rejects the upload before FastAPI sees it
    # and the user gets a bare 413 instead of a useful message.
    client_max_body_size 120M;

    # Security headers. No CSP frame-ancestors bypass, no MIME sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A receipt parse can legitimately take a couple of minutes. The upload
        # itself returns immediately, but keep headroom for the polling reads.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Hashed assets are immutable; the shell must never be cached or a deploy
    # leaves browsers on the old JS bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
