<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Follows the in-app theme, not only the OS one; the script below and the
         theme toggle keep it in step with --bg so the status bar blends in. -->
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="Shared expenses, split per item." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Installable to the home screen, where it opens without browser chrome. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Split" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Splitwise for flats</title>
    <script>
      // Applied before first paint so a dark-mode reload never flashes white,
      // and a glass account's reload never flashes the standard look. The glass
      // copy is written by useAppearance; the account's own copy wins once loaded.
      (function () {
        try {
          var root = document.documentElement;
          var colors = { light: "#fafafa", dark: "#09090b" };
          var saved = localStorage.getItem("theme");
          var dark = saved ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) root.classList.add("dark");

          var glass = JSON.parse(localStorage.getItem("tbb.glass") || "null");
          if (glass && glass.vars && glass.theme
              && typeof glass.theme.light === "string" && typeof glass.theme.dark === "string") {
            root.classList.add("glass");
            for (var name in glass.vars) {
              if (name.indexOf("--glass-") === 0) root.style.setProperty(name, String(glass.vars[name]));
            }
            colors = glass.theme;
          }
          document.querySelector('meta[name="theme-color"]')
            .setAttribute("content", dark ? colors.dark : colors.light);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
