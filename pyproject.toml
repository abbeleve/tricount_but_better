[project]
name = "tricount-but-better"
version = "0.1.0"
description = "Shared-expense tracking with AI receipt parsing"
readme = "README.md"
authors = [
    { name = "abbeleve", email = "integralisint@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "claude-agent-sdk>=0.1.0",
    "anthropic>=0.40",
    "pillow>=11.0",
]

[project.optional-dependencies]
# SOCKS5 support for routing model traffic through a VPN endpoint.
socks = ["httpx[socks]>=0.28"]
# Only needed if you outgrow SQLite and switch DATABASE_URL to Postgres.
postgres = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "mypy>=1.14",
]

[project.scripts]
tricount-but-better = "tricount_but_better.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
